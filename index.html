<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Academy - Annual Curriculum Dashboard</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;       /* Deep obsidian black */
            --bg-card: #121216;       /* Clean dark carbon gray */
            --bg-hover: #1a1a22;      /* Subtle item highlight */
            --text-main: #f3f4f6;     /* High contrast white */
            --text-muted: #9ca3af;    /* Soft readable gray */
            --accent: #818cf8;        /* Vivid electric indigo */
            --accent-glow: rgba(129, 140, 248, 0.15);
            --border: #262630;        /* Sharp low-light division lines */
            --success: #34d399;       /* Emerald neon accent */
            --warning: #fbbf24;       /* Soft amber accent */
            --info: #60a5fa;          /* Vibrant cyan accent */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            flex-direction: row;
        }

        /* --- Sidebar Layout (Desktop) --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            text-align: center;
        }

        .grade-btn-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grade-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 18px;
            text-align: left;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .grade-btn:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }

        .grade-btn.active {
            background-color: var(--accent-glow);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.1);
        }

        /* --- Main Content Layout (Desktop) --- */
        .main-content {
            margin-left: 260px;
            flex-grow: 1;
            padding: 40px;
            width: calc(100% - 260px);
        }

        .header {
            margin-bottom: 35px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 25px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* --- Responsive Table Wrapper --- */
        .table-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto; /* Enables swipe-scrolling on mobile cards */
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.95rem;
            vertical-align: top;
            line-height: 1.6;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        /* --- Badges --- */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            border: 1px solid transparent;
        }

        .badge-wd { background-color: rgba(96, 165, 250, 0.1); border-color: rgba(96, 165, 250, 0.3); color: var(--info); }
        .badge-td { background-color: rgba(52, 211, 153, 0.1); border-color: rgba(52, 211, 153, 0.3); color: var(--success); }
        .badge-tp { background-color: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.3); color: var(--warning); }

        .remarks-text {
            font-style: italic;
            color: #c084fc;
        }

        /* ==========================================================================
           RESPONSIVE MEDIA QUERIES (Tablets & Mobile Screen Formats)
           ========================================================================== */
        
        /* --- Tablet Breakpoint (Screen size under 1024px) --- */
        @media (max-width: 1024px) {
            .sidebar {
                width: 200px;
                padding: 20px 10px;
            }
            .sidebar h2 {
                font-size: 0.95rem;
                letter-spacing: 1px;
            }
            .grade-btn {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
            .main-content {
                margin-left: 200px;
                width: calc(100% - 200px);
                padding: 30px 20px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
        }

        /* --- Smartphone Breakpoint (Screen size under 768px) --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* Stacks navigation above the content main grid */
            }

            /* Transforms sidebar into a sticky top row scrolling tracker */
            .sidebar {
                position: sticky;
                top: 0;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 12px 15px;
                flex-direction: row;
                align-items: center;
                gap: 15px;
                overflow-x: auto;
                white-space: nowrap;
                box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            }

            .sidebar h2 {
                margin-bottom: 0;
                padding-bottom: 0;
                border-bottom: none;
                font-size: 0.9rem;
                border-right: 1px solid var(--border);
                padding-right: 15px;
            }

            .grade-btn-container {
                flex-direction: row; /* Horizontal scrolling items button set */
                gap: 8px;
                overflow-x: auto;
                width: 100%;
            }

            .grade-btn {
                padding: 8px 14px;
                font-size: 0.85rem;
            }

            /* Main Content Container Reset */
            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 20px 15px;
            }

            .header {
                margin-bottom: 20px;
                padding-bottom: 15px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.9rem;
            }
            
            /* Fluid adjustment inside data padding rows */
            td, th {
                padding: 12px 14px;
                font-size: 0.85rem;
            }
        }
    </style>

        // UI Loader Controller function
        function loadGrade(gradeNum) {
            // Update Active Buttons styles safely
            document.querySelectorAll('.grade-btn').forEach(btn => btn.classList.remove('active'));
            
            // Find execution element context gracefully
            if(event && event.target) {
                event.target.classList.add('active');
            } else {
                document.querySelector(`.grade-btn:nth-child(${gradeNum})`).classList.add('active');
            }

            // Fetch and set descriptions
            const currentData = curriculumData[gradeNum];
            document.getElementById('grade-title').innerText = `Grade ${gradeNum} Curriculum Plan`;
            document.getElementById('grade-desc').innerText = currentData.desc;

            // Target table body insertion point
            const tbody = document.getElementById('curriculum-body');
            tbody.innerHTML = ''; // Wipe past rows cleanly

            // Build structural row templates dynamically
            currentData.rows.forEach(rowData => {
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td><strong style="color: #fff;">${rowData[0]}</strong></td>
                    <td><span class="badge badge-wd">${rowData[1]}</span></td>
                    <td><span class="badge badge-td">${rowData[2]}</span></td>
                    <td><span class="badge badge-tp">${rowData[3]}</span></td>
                    <td><strong style="color: var(--text-main);">${rowData[4].split(' / ')[0]}</strong><br><small style="color:var(--text-muted)">${rowData[4].split(' / ')[1] || ''}</small></td>
                    <td>${rowData[5]}</td>
                    <td>${rowData[6]}</td>
                    <td><span style="color:#60a5fa; font-weight:600;">${rowData[7]}</span></td>
                    <td><span style="color:#f472b6;">${rowData[8]}</span></td>
                    <td class="remarks-text">${rowData[9]}</td>
                `;
                
                tbody.appendChild(tr);
            });
        }

        window.onload = function() {
